# 日志轮转：json-file 单文件 10 MB、保留 3 份，避免容器日志吃满磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sthmoving
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: sthmoving
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sthmoving -d sthmoving']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging


  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://sthmoving:${POSTGRES_PASSWORD:?}@postgres:5432/sthmoving
      WECHAT_APP_ID: ${WECHAT_APP_ID:?}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      STORAGE_ROOT: /var/lib/sthmoving/files
      FILE_SIGNING_SECRET: ${FILE_SIGNING_SECRET:?}
      MINI_PROGRAM_ENVIRONMENT: ${MINI_PROGRAM_ENVIRONMENT:-release}
      OWNER_BOOTSTRAP_TOKEN: ${OWNER_BOOTSTRAP_TOKEN:-}
      # 审核沙箱：未设置 TEST_DATABASE_URL 时沙箱整体关闭
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
      TEST_ACCESS_TTL_HOURS: ${TEST_ACCESS_TTL_HOURS:-168}
      # 必须与 STORAGE_ROOT 平级（服务端启动期拒绝嵌套），独立卷持久化
      TEST_STORAGE_ROOT: ${TEST_STORAGE_ROOT:-/var/lib/sthmoving/files-test}
      TEST_FILE_SIGNING_SECRET: ${TEST_FILE_SIGNING_SECRET:-}
    volumes:
      - api-files:/var/lib/sthmoving/files
      - api-files-test:/var/lib/sthmoving/files-test
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

    logging: *default-logging

volumes:
  postgres-data:
  api-files:
  api-files-test:
  caddy-data:
  caddy-config:
