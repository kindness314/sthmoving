services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sthmoving
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: sthmoving
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sthmoving -d sthmoving']
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://sthmoving:${POSTGRES_PASSWORD:?}@postgres:5432/sthmoving
      WECHAT_APP_ID: ${WECHAT_APP_ID:?}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      STORAGE_ROOT: /var/lib/sthmoving/files
      FILE_SIGNING_SECRET: ${FILE_SIGNING_SECRET:?}
      MINI_PROGRAM_ENVIRONMENT: ${MINI_PROGRAM_ENVIRONMENT:-release}
      OWNER_BOOTSTRAP_TOKEN: ${OWNER_BOOTSTRAP_TOKEN:-}
    volumes:
      - api-files:/var/lib/sthmoving/files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  api-files:
  caddy-data:
  caddy-config:
