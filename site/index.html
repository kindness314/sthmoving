<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YUNA个物终端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f6f8fb;
      color: #1f2937;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 48px 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      padding: 48px 40px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    h1 { font-size: 28px; letter-spacing: 1px; color: #17365d; }
    .slogan { margin-top: 12px; font-size: 15px; color: #6b7280; line-height: 1.8; }
    .entry {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 28px;
      border-radius: 999px;
      background: #17365d;
      color: #ffffff;
      font-size: 14px;
      text-decoration: none;
    }
    .desc { margin-top: 32px; font-size: 13px; color: #9ca3af; line-height: 2; }
    footer { margin-top: 40px; font-size: 12px; color: #9ca3af; }
    footer a { color: #9ca3af; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>YUNA个物终端</h1>
    <p class="slogan">物品登记、查询、离库与标签打印的一体化管理工具</p>
    <a class="entry" href="https://yunasthmoving.cn/health">服务运行中</a>
    <p class="desc">
      本站为「YUNA个物终端」微信小程序的服务端，<br />
      请在微信中搜索小程序名称使用完整功能。
    </p>
  </main>
  <footer>
    <!-- TODO: 替换为真实 ICP 备案号 -->

</html>
