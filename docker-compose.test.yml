services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sthmoving
      POSTGRES_PASSWORD: sthmoving
      POSTGRES_DB: sthmoving_test
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sthmoving -d sthmoving_test']
      interval: 2s
      timeout: 3s
      retries: 15
